<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Producto - Tienda App Móvil Premium</title>
  <link rel="stylesheet" href="estilos.css">
  <style>
    .detalle-container {
      max-width: 1000px;
      margin: 2rem auto;
      background-color: var(--color-superficie);
      border: 1px solid rgba(226, 232, 240, 0.1);
      border-radius: var(--radius-xl);
      padding: 3rem;
      box-shadow: var(--shadow-xl);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: start;
    }

    .detalle-imagen {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      aspect-ratio: 4/3;
    }

    .detalle-info {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .detalle-categoria {
      text-transform: uppercase;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-primario);
      letter-spacing: 1px;
    }

    .detalle-nombre {
      font-size: 2.5rem;
      color: var(--color-texto);
      line-height: 1.2;
    }

    .detalle-rating {
      color: #fbbf24;
      font-size: 1.2rem;
    }

    .detalle-precio-box {
      background-color: var(--color-fondo);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--color-borde);
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    .detalle-precio {
      font-size: 2rem;
      font-weight: bold;
      color: var(--color-primario);
    }

    .detalle-cuotas {
      font-size: 1rem;
      font-weight: bold;
      color: #10b981; /* Verde esmeralda para cuotas */
      margin-top: 0.5rem;
    }

    .detalle-descripcion {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--color-texto-suave);
      margin-bottom: 1.5rem;
    }

    .btn-comprar {
      background: transparent;
      color: var(--color-texto);
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: 600;
      border: 1px solid var(--color-borde);
      border-radius: var(--radius-xl);
      cursor: pointer;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      width: 100%;
    }

    .btn-comprar:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--color-texto-suave);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .detalle-container {
        grid-template-columns: 1fr;
        padding: 1.5rem;
        gap: 2rem;
      }
      
      .detalle-nombre {
        font-size: 2rem;
      }
    }

    /* Estilos para la sección de comentarios */
    .comentarios-seccion {
      max-width: 1000px;
      margin: 2rem auto;
      background-color: var(--color-superficie);
      border: 1px solid rgba(226, 232, 240, 0.1);
      border-radius: var(--radius-xl);
      padding: 3rem;
      box-shadow: var(--shadow-xl);
    }
    
    .comentarios-seccion h3 {
      font-size: 1.8rem;
      color: var(--color-texto);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--color-borde);
      padding-bottom: 1rem;
    }
    
    .comentario-card {
      border-bottom: 1px solid var(--color-borde);
      padding: 1.5rem 0;
    }
    
    .comentario-card:last-child {
      border-bottom: none;
    }
    
    .comentario-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    
    .comentario-usuario {
      font-weight: bold;
      color: var(--color-texto);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .avatar-placeholder {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--color-primario) 0%, var(--color-secundario) 100%);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
    }
    
    .comentario-fecha {
      font-size: 0.85rem;
      color: var(--color-texto-suave);
    }
    
    .comentario-estrellas {
      color: #fbbf24;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    
    .comentario-texto {
      color: var(--color-texto-suave);
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h1>Tienda App Móvil Premium</h1>
    <div class="header-controls">
      <nav>
        <ul>
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="index.html#categorias">Categorías</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="formulario.html">Contacto</a></li>
          <li><a href="login.html" class="btn-login">Iniciar Sesión</a></li>
        </ul>
      </nav>
      <div class="carrito" aria-label="Carrito de compra" tabindex="0">
        <button class="carrito-btn" aria-label="Abrir carrito">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="badge" aria-label="Cantidad de productos">0</span>
        </button>
        <div class="carrito-panel" aria-label="Contenido del carrito">
          <div id="carrito-items-container"></div>
          <div class="carrito-total" id="carrito-total-texto">Total: $0.00</div>
          <button id="btn-finalizar-compra" class="btn-principal" style="width: 100%; text-align: center; margin-top: 10px; display: block; border: none; cursor: pointer;">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div style="margin-bottom: 1rem;">
      <a href="catalogo.html" style="color: var(--color-primario); text-decoration: none; font-weight: bold;">&larr; Volver al catálogo</a>
    </div>

    <!-- Contenedor principal que será llenado por JavaScript -->
    <div id="detalle-producto-container" class="detalle-container">
      <div class="detalle-imagen-wrapper">
        <img id="detalle-img" class="detalle-imagen" src="" alt="Cargando..." />
      </div>
      
      <div class="detalle-info">
        <div id="detalle-categoria" class="detalle-categoria"></div>
        <h2 id="detalle-nombre" class="detalle-nombre">Cargando...</h2>
        <div id="detalle-rating" class="detalle-rating"></div>
        
        <div class="detalle-precio-box">
          <div id="detalle-precio" class="detalle-precio"></div>
          <div id="detalle-cuotas" class="detalle-cuotas"></div>
        </div>
        
        <div id="detalle-descripcion" class="detalle-descripcion"></div>
        
        <button id="btn-add-cart-detalle" class="btn-comprar">
          🛒 Añadir al carrito
        </button>
      </div>
    </div>

    <!-- Contenedor para la sección de comentarios -->
    <div id="comentarios-container" class="comentarios-seccion" style="display: none;">
      <h3>Reseñas de Usuarios</h3>
      <div id="comentarios-lista">
        <p style="color: #64748b;">Cargando comentarios...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Tienda de Apps Móviles. Todos los derechos reservados.</p>
    <address>
      Contacto: <a href="mailto:info@tiendaapps.com">ezequieleiannotti@gmail.com</a>
    </address>
  </footer>

  <!-- Cargamos el script que se encargará de rellenar la info -->
  <script src="js/config.js"></script>
  <script src="js/carrito.js"></script>
  <script src="productos.js"></script>
</body>

</html>
