<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Productos</title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
  <header>
    <h1>Tienda App Móvil Premium</h1>
    <div class="header-controls">
      <button class="hamburger-btn" aria-label="Abrir menú" aria-expanded="false">&#x2630;</button>
      <nav>
        <ul>
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="index.html#categorias">Categorías</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="formulario.html">Contacto</a></li>
          <li><a href="login.html" class="btn-login">Iniciar Sesión</a></li>
        </ul>
      </nav>
      <div class="carrito" aria-label="Carrito de compra" tabindex="0">
        <button class="carrito-btn" aria-label="Abrir carrito">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="badge" aria-label="Cantidad de productos">0</span>
        </button>
        <div class="carrito-panel" aria-label="Contenido del carrito">
          <div id="carrito-items-container"></div>
          <div class="carrito-total" id="carrito-total-texto">Total: $0.00</div>
          <button id="btn-finalizar-compra" class="btn-principal" style="width: 100%; text-align: center; margin-top: 10px; display: block; border: none; cursor: pointer;">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 style="margin-bottom: 0;">Catálogo de Productos</h1>
      
      <div class="search-bar" style="display: flex; gap: 0.5rem; max-width: 400px; width: 100%;">
        <input id="search-input" type="text" placeholder="Buscar aplicaciones..." style="flex: 1; padding: 0.6rem 1rem; background-color: var(--color-fondo); color: var(--color-texto); border: 1px solid var(--color-borde); border-radius: 99px; font-size: 1rem; outline: none; transition: all 0.3s;" onfocus="this.style.borderColor='var(--color-primario)'; this.style.boxShadow='0 0 0 3px rgba(129, 140, 248, 0.15)'" onblur="this.style.borderColor='var(--color-borde)'; this.style.boxShadow='none'">
        <button id="search-button" style="background-color: transparent; color: var(--color-texto); border: 1px solid var(--color-borde); border-radius: 99px; padding: 0 1.5rem; font-weight: 600; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.backgroundColor='rgba(255,255,255,0.05)'; this.style.borderColor='var(--color-texto-suave)'" onmouseout="this.style.backgroundColor='transparent'; this.style.borderColor='var(--color-borde)'">Buscar</button>
      </div>
    </div>
    <div id="filtros-container" style="margin-bottom: 20px;">
      <!-- Contenedor libre para futuros filtros, búsquedas o carrito -->
    </div>
    
    <!-- Aquí le damos un ID para que JS pueda encontrarlo fácilmente y no le quitamos su clase para que no se pierda el CSS -->
    <div class="productos-grid" id="productos-container">
      <!-- Los productos se inyectarán dinámicamente con JavaScript aquí -->
    </div>
  </main>
  <!-- Enlazamos aquí nuestro JavaScript antes de que cierre el body -->
  <script src="js/nav.js"></script>
  <script src="js/config.js"></script>
  <script src="js/carrito.js"></script>
  <script src="productos.js"></script>
</body>

</html>
