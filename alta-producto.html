<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta de Producto</title>
  <link rel="stylesheet" href="CSS/estilos.css">
</head>
<body>
  <header>
    <h1>Tienda App Móvil Premium</h1>
    <div class="header-controls">
      <button class="hamburger-btn" aria-label="Abrir menú" aria-expanded="false">&#x2630;</button>
      <nav>
        <ul>
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="index.html#categorias">Categorías</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="formulario.html">Contacto</a></li>
          <li><a href="index.html" class="btn-login" style="background-color: #ef4444; color: white;">Cerrar Sesión</a></li>
        </ul>
      </nav>
      <div class="carrito" aria-label="Carrito de compra" tabindex="0">
        <button class="carrito-btn" aria-label="Abrir carrito">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <span class="badge" aria-label="Cantidad de productos">0</span>
        </button>
        <div class="carrito-panel" aria-label="Contenido del carrito">
          <div id="carrito-items-container"></div>
          <div class="carrito-total" id="carrito-total-texto">Total: $0.00</div>
          <button id="btn-finalizar-compra" class="btn-principal" style="width: 100%; text-align: center; margin-top: 10px; display: block; border: none; cursor: pointer;">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="form-container">
      <h2>Alta de Nuevo Producto</h2>
      <form id="form-alta-producto" action="#" method="POST">
        <div class="form-group">
          <label for="nombre">Nombre de la App / Producto:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Super Todo List" required>
        </div>

        <div class="form-group">
          <label for="precio">Precio (USD):</label>
          <input type="number" id="precio" name="precio" step="0.01" placeholder="Ej: 9.99" required>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción de las funciones:</label>
          <textarea id="descripcion" name="descripcion" rows="4" placeholder="Detalla qué hace la aplicación..."></textarea>
        </div>

        <div class="form-group">
          <label for="categoria">Categoría:</label>
          <select id="categoria" name="categoria">
            <option value="juegos">Juegos</option>
            <option value="productividad">Productividad</option>
            <option value="social">Social</option>
            <option value="educacion">Educación</option>
            <option value="otros">Otros</option>
          </select>
        </div>

        <div class="form-group">
          <label for="stock">Stock disponible (licencias):</label>
          <input type="number" id="stock" name="stock" min="0" placeholder="Ej: 100">
        </div>

        <div class="form-group">
          <label for="imagen">URL de imagen del producto:</label>
          <input type="url" id="imagen" name="imagen" placeholder="https://ejemplo.com/imagen.png">
          <div id="imagen-preview-container" style="display:none; margin-top: 0.75rem;">
            <p style="font-size: 0.8rem; color: var(--color-texto-suave); margin-bottom: 0.4rem;">Vista previa:</p>
            <img id="imagen-preview"
              src=""
              alt="Vista previa"
              style="width: 100%; max-width: 280px; height: 160px; object-fit: cover; border-radius: 10px; border: 1px solid var(--color-borde); display: block;"
            />
          </div>
        </div>

        <button type="submit" class="btn-submit">Registrar Producto</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Tienda de Apps Móviles. Todos los derechos reservados.</p>
    <address>
      Contacto: <a href="mailto:info@tiendaapps.com">ezequieleiannotti@gmail.com</a>
    </address>
  </footer>
  <script src="JS/nav.js"></script>
  <script src="JS/config.js"></script>
  <script src="JS/carrito.js"></script>
  <script src="JS/alta-producto.js"></script>
</body>
</html>
