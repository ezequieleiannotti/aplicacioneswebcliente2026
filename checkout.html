<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Finalizar Compra</title>
  <link rel="stylesheet" href="CSS/estilos.css">
  <style>
    .checkout-container {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 2rem;
      max-width: 1200px;
      margin: 2rem auto;
      align-items: start;
    }

    .checkout-form {
      background-color: var(--color-superficie);
      border: 1px solid rgba(226, 232, 240, 0.1);
      border-radius: var(--radius-xl);
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-xl);
    }

    .checkout-form h2 {
      margin-bottom: 2rem;
      color: var(--color-texto);
      font-weight: 700;
      letter-spacing: -0.02em;
      border-bottom: 1px solid var(--color-borde);
      padding-bottom: 1rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .order-summary {
      background-color: var(--color-superficie);
      border: 1px solid rgba(226, 232, 240, 0.1);
      border-radius: var(--radius-xl);
      padding: 2rem;
      position: sticky;
      top: 2rem;
    }

    .order-summary h3 {
      margin-bottom: 1.5rem;
      color: var(--color-texto);
      font-weight: 700;
      letter-spacing: -0.01em;
      border-bottom: 1px solid var(--color-borde);
      padding-bottom: 0.5rem;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 2px dashed var(--color-borde);
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--color-primario);
    }

    .payment-methods {
      margin-top: 2rem;
    }

    .payment-methods h4 {
      margin-bottom: 1rem;
      color: var(--color-texto);
    }

    .method-card {
      background-color: var(--color-fondo);
      border: 1px solid var(--color-borde);
      border-radius: var(--radius-lg);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .method-card:hover {
      border-color: var(--color-texto-suave);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .method-card input[type="radio"] {
      transform: scale(1.2);
    }

    @media (max-width: 900px) {
      .checkout-container {
        grid-template-columns: 1fr;
      }
    }
    
    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Tienda App Móvil Premium</h1>
    <div class="header-controls">
      <button class="hamburger-btn" aria-label="Abrir menú" aria-expanded="false">&#x2630;</button>
      <nav>
        <ul>
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="index.html#categorias">Categorías</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="formulario.html">Contacto</a></li>
          <li><a href="login.html" class="btn-login">Iniciar Sesión</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="checkout-container">
      
      <!-- Formulario de Checkout -->
      <div class="checkout-form">
        <h2>Detalles de Facturación</h2>
        <form id="checkoutForm" action="index.html" method="GET">
          
          <div class="form-row">
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </div>
            <div class="form-group">
              <label for="apellido">Apellido</label>
              <input type="text" id="apellido" name="apellido" required placeholder="Tu apellido">
            </div>
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
          </div>

          <div class="form-group">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" required placeholder="Calle, número, piso, dpto...">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ciudad">Ciudad</label>
              <input type="text" id="ciudad" name="ciudad" required placeholder="Tu ciudad">
            </div>
            <div class="form-group">
              <label for="codigo_postal">Código Postal</label>
              <input type="text" id="codigo_postal" name="codigo_postal" required placeholder="Ej: 1234">
            </div>
          </div>

          <div class="payment-methods">
            <h4>Método de Pago</h4>
            <label class="method-card">
              <input type="radio" name="pago" value="tarjeta" checked>
              <span>💳 Tarjeta de Crédito / Débito</span>
            </label>
            <label class="method-card">
              <input type="radio" name="pago" value="paypal">
              <span>🅿️ PayPal</span>
            </label>
            <label class="method-card">
              <input type="radio" name="pago" value="transferencia">
              <span>🏦 Transferencia Bancaria</span>
            </label>
          </div>

          <button type="submit" class="btn-submit" style="margin-top: 2rem;">Confirmar Pedido</button>
        </form>
      </div>

      <!-- Resumen de Orden (se llena dinámicamente desde carrito.js) -->
      <div class="order-summary">
        <h3>Resumen de tu Orden</h3>
      </div>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 Tienda de Apps Móviles. Todos los derechos reservados.</p>
    <address>
      Contacto: <a href="mailto:info@tiendaapps.com">ezequieleiannotti@gmail.com</a>
    </address>
  </footer>
  <script src="JS/nav.js"></script>
  <script src="JS/config.js"></script>
  <script src="JS/carrito.js"></script>
  <script src="JS/checkout.js"></script>
</body>

</html>
