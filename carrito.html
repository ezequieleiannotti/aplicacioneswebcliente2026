<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu Carrito - Tienda App Móvil Premium</title>
  <link rel="stylesheet" href="CSS/estilos.css">
  <style>
    .carrito-page {
      max-width: 680px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }

    .carrito-page-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .carrito-page-header h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--color-texto);
      margin: 0;
    }

    .carrito-page-header .cantidad-badge {
      background: var(--color-primario);
      color: white;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 99px;
      padding: 2px 10px;
    }

    /* Panel de items */
    .carrito-page-items {
      background: var(--color-superficie);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-borde);
      padding: 0.5rem 1rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-xl);
    }

    /* Agrandar imagen y padding en vista de página completa */
    .carrito-page-items .carrito-item {
      padding: 1rem 0.5rem;
    }

    .carrito-page-items .carrito-item img {
      width: 60px !important;
      height: 60px !important;
      border-radius: 8px !important;
    }

    .carrito-page-items .carrito-titulo {
      font-size: 1rem;
      font-weight: 600;
    }

    .carrito-page-items .carrito-precio {
      font-size: 0.95rem;
      color: var(--color-texto-suave);
      margin-top: 2px;
    }

    /* Resumen de precio */
    .carrito-page-resumen {
      background: var(--color-superficie);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-borde);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-xl);
    }

    .carrito-page-resumen .linea {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      font-size: 0.95rem;
      color: var(--color-texto-suave);
    }

    .carrito-page-resumen .linea-total {
      display: flex;
      justify-content: space-between;
      padding-top: 0.9rem;
      margin-top: 0.5rem;
      border-top: 2px dashed var(--color-borde);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--color-primario);
    }

    /* Acciones */
    .carrito-page-actions {
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
    }

    .btn-seguir-comprando {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.8rem 1.5rem;
      border-radius: 99px;
      border: 1px solid var(--color-borde);
      background: var(--color-superficie);
      color: var(--color-texto);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-seguir-comprando:hover {
      background: var(--color-fondo);
      border-color: var(--color-texto-suave);
    }

    .btn-ir-pagar {
      flex: 1;
      padding: 0.9rem 2rem;
      border-radius: 99px;
      border: none;
      background: linear-gradient(135deg, var(--color-primario) 0%, #3b82f6 100%);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-ir-pagar:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-ir-pagar:active {
      transform: translateY(0);
    }

    /* Estado vacío */
    .carrito-vacio {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--color-texto-suave);
    }

    .carrito-vacio p {
      margin-bottom: 1.5rem;
      font-size: 1.05rem;
    }

    @media (max-width: 480px) {
      .carrito-page-actions {
        flex-direction: column-reverse;
      }

      .btn-seguir-comprando,
      .btn-ir-pagar {
        width: 100%;
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Tienda App Móvil Premium</h1>
    <div class="header-controls">
      <button class="hamburger-btn" aria-label="Abrir menú" aria-expanded="false">&#x2630;</button>
      <nav>
        <ul>
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="index.html#categorias">Categorías</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="formulario.html">Contacto</a></li>
          <li><a href="login.html" class="btn-login">Iniciar Sesión</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="carrito-page">

      <div class="carrito-page-header">
        <h2>Tu Carrito</h2>
        <span class="cantidad-badge badge">0</span>
      </div>

      <div class="carrito-page-items">
        <div id="carrito-items-container"></div>
      </div>

      <div class="carrito-page-resumen" id="resumen-precios" style="display:none;">
        <div class="linea">
          <span>Subtotal</span>
          <span id="subtotal-texto">$0.00</span>
        </div>
        <div class="linea">
          <span>Impuestos (21%)</span>
          <span id="impuestos-texto">$0.00</span>
        </div>
        <div class="linea-total">
          <span>Total</span>
          <span id="carrito-total-texto">$0.00</span>
        </div>
      </div>

      <div class="carrito-page-actions" id="carrito-acciones" style="display:none;">
        <a href="catalogo.html" class="btn-seguir-comprando">← Seguir comprando</a>
        <button id="btn-ir-pagar" class="btn-ir-pagar">Ir a pagar →</button>
      </div>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 Tienda de Apps Móviles. Todos los derechos reservados.</p>
    <address>
      Contacto: <a href="mailto:info@tiendaapps.com">ezequieleiannotti@gmail.com</a>
    </address>
  </footer>

  <script src="JS/nav.js"></script>
  <script src="JS/config.js"></script>
  <script src="JS/carrito.js"></script>
  <script src="JS/carrito-page.js"></script>
</body>

</html>
